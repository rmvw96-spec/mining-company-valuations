# Settings for the Sprott miner ETF look-through valuations.
# Every command reads this file when it starts, so edits take effect on the next run.
# Personal settings (your Google Sheet ID, credentials path) go in private/local.toml instead.

[holdings]
file = "data/holdings.csv"          # one row per fund holding: fund, holding, ticker (Sprott's), weight_pct
as_of = "2026-11-13"                # date of the Sprott holdings snapshot
fund_order = ["SGDM", "SGDJ", "GBUG", "SLVR", "COPP", "COPJ"]
physical_trusts = ["PSLV", "COP/U"] # metal trusts: left out of company multiples
non_operating = ["INDA"]            # not a mining company (listed in COPP on Sprott's page)
stale_before = "2025-06-30"         # financials older than this are left out of fund multiples

[funds]
SGDM = { metal = "gold", focus = "Large gold miners" }
SGDJ = { metal = "gold", focus = "Junior gold miners" }
GBUG = { metal = "gold", focus = "Active gold & silver" }
SLVR = { metal = "silver", focus = "Silver miners + PSLV" }
COPP = { metal = "copper", focus = "Copper miners" }
COPJ = { metal = "copper", focus = "Junior copper miners" }

[price_model]
# A change in metal prices changes revenue by: revenue x sum(metal share x (price / average price - 1)).
ebitda_share = 0.95                 # share of that revenue change reaching EBITDA (royalties take ~5%)
cash_flow_share = 0.70              # share reaching operating and free cash flow (after ~30% tax)
average_window_days = 365           # window for the average price over a company's reported 12 months

# Revenue shares for companies not listed in config/metal_mix.csv, by their fund's metal.
[price_model.default_mix]
gold = { gold = 1.0 }
silver = { silver = 0.60, gold = 0.40 }
copper = { copper = 0.90 }

# Metal price scenarios ($/oz gold and silver, $/lb copper). "Today" is always the latest price.
# Keep these in step with 'Metal prices reference'!H15:K17 on the Sheet, which drives the Sheet's own formulas.
[scenarios]
Severe = { gold = 2200, silver = 25, copper = 3.0 }
Low = { gold = 3500, silver = 35, copper = 4.0 }
High = { gold = 4500, silver = 70, copper = 7.0 }
"All-time high" = { gold = 5586.2, silver = 121.3, copper = 6.83 }

[stress]
scenarios = ["Severe", "Low", "Today", "High"]   # columns of the stress test, in order
dilution_tolerance_days = { 1 = 100, 3 = 200 }    # how far a share count may sit from exactly 1 or 3 years back

[pnav]
# Discount rate = 10-year Treasury yield + risk premium + jurisdiction add-on (data/research/pnav_companies.csv).
ten_year_yield = 0.0512             # offline copy; the price updater refreshes the Sheet's own cell
risk_premium = 0.03
max_years = 25                      # reserve life used is capped at this
short_years = 10                    # the "10-year horizon" column
scenarios = ["Today", "Low", "High", "All-time high"]
no_metal_adjustment = ["VALT LN", "661 HK"]   # platinum producer and a smelter: cash flow is left as reported

[yahoo]
user_agent = "Mozilla/5.0 (X11; Linux x86_64)"
workers = 6                         # parallel requests
history_start = "2020-01-01"        # first date of the fundamentals series fetched
metals = { gold = "GC=F", silver = "SI=F", copper = "HG=F" }   # COMEX front-month futures
ten_year_yield = "^TNX"             # quoted in percent (5.12 = 5.12%)

# Sprott exchange codes -> Yahoo suffixes, tried in order. Hong Kong (HK) codes are zero-padded to 4 digits.
[yahoo.suffixes]
AU = [".AX"]
LN = [".L"]
SJ = [".JO"]
TI = [".IS"]
PW = [".WA"]
IJ = [".JK"]
PM = [".PS"]
SS = [".ST"]
FH = [".HE"]
MC = [".CS"]
CN = [".TO", ".V", ".CN", ".NE"]

# Yahoo quotes some prices in minor units. The Sheet's FX table uses upper-case codes, because
# XLOOKUP ignores case and "GBp" would otherwise match "GBP" (100x too large).
[yahoo.minor_units]
GBp = { code = "GBX", major = "GBP", per_major = 100 }
ZAc = { code = "ZAC", major = "ZAR", per_major = 100 }
ILA = { code = "ILA", major = "ILS", per_major = 100 }

[sheet]
# Which cells the commands read and write. Change these only if you move things on the Sheet.
holdings_tab = "Holdings"
last_row = 1000
price_headers = ["Share price (local currency)", "Price currency", "Price date",
                 "Shares outstanding (millions)", "US$ per unit of price currency"]   # Holdings!R1:V1
fx_headers = ["Currency", "US$ per unit", "Source", "Rate date"]                     # Holdings!Y1:AB1
# FX table order (Holdings!Y2:Y18). Only used for Claude Sheets payloads; with Google Sheets the table is read.
fx_rows = ["USD", "AUD", "CAD", "CLP", "CNY", "EUR", "GBP", "GBX", "HKD", "IDR", "MXN",
           "PHP", "PLN", "SEK", "TRY", "ZAR", "ZAC"]
fx_derived = { GBX = "GBP", ZAC = "ZAR" }     # rows that are formulas (=GBP rate / 100)

metals_tab = "Metal prices reference"
metal_cells = { gold = "C15", silver = "C16", copper = "C17" }
metal_labels = { gold = "Gold ($/oz)", silver = "Silver ($/oz)", copper = "Copper ($/lb)" }   # B15:B17
yield_cell = "C30"
yield_label = "10-year Treasury yield"                                                         # B30

downside_tab = "Holdings downside"
pnav_inputs_tab = "PNAV inputs"
pnav_first_row = 12
pnav_last_row = 154

[report]
stale_days = 6          # flag prices older than this
big_move = 0.25         # flag moves larger than this over the last 5 trading days
share_change = 0.10     # flag share-count changes larger than this
