breadth_copj = [0.6, 0.3]           # is a broad uptrend; under 30%, most juniors are still falling

# Inputs block on the Signals tab (key = value). Blank ones are left for you to fill in on the Sheet.
[signals.inputs]
# industry_aisc (the Signals input row) comes from data/research/industry_aisc.csv: the latest quarter published
# by the run date. Python writes it to the Signals tab on every run; add new quarters to the CSV, not here.
producer_cost_increase = 0.0        # used by the P/NAV and Low-scenario cash flows (Part 3 of the spec)
near_cash_share = 0.5               # developer "trading near cash" when cash is at least this share of market value
runway_short_months = 12            # framework: hold at least 12 to 18 months of cash
runway_ok_months = 18
# Developer financing (roadmap 3). A developer with a funding gap is assumed to raise it all in equity at this
# discount to today's price: the typical bought-deal discount, and the pessimistic case (debt and streams dilute less).
raise_discount = 0.15
# EV per weighted unit: conventional rules of thumb for how much an ounce in each category is worth against a reserve.
resource_weight_reserves = 1.0
resource_weight_mi = 0.5            # measured & indicated, excluding reserves
resource_weight_inferred = 0.2

# Model portfolio column W: which signals each bucket shows (keys on the Signals tab, joined with " / ").
# "Bucket|Metal" entries win over "Bucket". "=text" shows the text itself; "@developer_check" is this row's
# PNAV inputs developer check. Any royalty/streaming company shows its royalty band instead.
[signals.timing]
"Physical metal|Gold" = ["two_year_3m_change"]
"Physical metal|Silver" = ["gold_silver_ratio"]
"Physical metal|Copper" = ["=No framework signal for physical copper"]
"Gold producers" = ["gold_vs_diesel_12m", "gdx_gold_pctile10y"]
"Growth: expanding producers" = ["gold_vs_diesel_12m", "gdx_gold_pctile10y"]
"Copper producers" = ["copper_vs_diesel_12m", "copx_copper_pctile10y"]
"Silver and polymetallic producers" = ["silver_vs_diesel_12m", "sil_silver_pctile10y"]
"Growth: developers" = ["junior_timing", "breadth_sgdj", "@developer_check"]
"Growth: developers|Copper" = ["junior_timing", "breadth_copj", "@developer_check"]

[valuation]
# Roadmap 6 (docs/specs/tier-valuation-spec.md). Study rebuilds (minerval/studies.py): the rebuilt NPV at the study's
# own price and rate must be within check_npv of the published one, and the re-pricing within check_sensitivity of
# the study's own sensitivity rows, or the study isn't used for a buy signal.
# Price decks (Part 1): each a [scenarios] entry with gold, silver and copper set on its own (no ratio links them),
# with its source and date in a comment. The values are the user's; nothing in the code depends on them.
decks = ["Pessimistic", "Base", "Optimistic"]
pessimistic_deck = "Pessimistic"   # runs with costs raised by pessimistic_cost_increase
base_deck = "Base"
horizon_years = 10                  # producers and royalties: min(reserve life, this), no terminal value
check_factor = 2.0                  # validation: flag an NAV more than 2x from the independent or consensus NAV
check_npv = 0.05
check_sensitivity = 0.10
# Developers' financing (Rule Investment Newsletter #22, "Build or sell?", Nov 11, 2026): his model finances a build
# with 35% equity, raised "often at a 15% discount to the market price" (the Signals input raise_discount), the rest
# debt; dilution is priced into the buy-below per share rather than tested against a limit (the user, Nov 22, 2026).
equity_share = 0.35
dilution_note_above = 1.0           # note a raise at the largest overrun that more than doubles the share count
capex_overrun = [0.15, 0.30]

# Probability that a project at each stage reaches production (minerval/studies.py stage(): construction = a
# construction decision; permitted = key permits in hand after at least a PFS, projects.csv `permits`; else the
# study type). Researched Nov 21, 2026; kept by the user Nov 22, 2026. No source publishes stage-by-stage conversion
# rates; the evidence found:
#   - MinEx Consulting (R. Schodde): about 45% of significant discoveries since 1950 became mines (gold 51%, copper
#     39%), on average 16-17 years after discovery; the rate has fallen in recent years.
#   - S&P Global Market Intelligence: discovery to production averages about 16 years (232 assets), and nearly 30
#     years for unbuilt projects that have had a feasibility study, mostly from permitting delays (Jul 2026).
#   - An unsourced investor funnel, widely repeated: about 60% of feasibility-stage projects are financed and built.
#   - McKinsey: only a fifth of 40+ projects delivered the returns predicted at feasibility (an overrun risk, which
#     the capex-overrun test covers, not a probability of being built).
#   - Sprott (Aug 2022) P/NAV by stage, PEA 0.2-0.5, PFS/FS 0.2-0.7, construction 0.5-0.8, production 0.6-1.5: market
#     multiples, which also price time and risk aversion, so they bound but don't give the probabilities.
# A PEA (inferred resources allowed, about +/-35-50% cost accuracy) sits below the long-run 45%; a PFS is the first
# study that can declare reserves; feasibility follows the 60% funnel; permits remove the main source of delay;
# construction leaves completion risk. Not tuned to any data.
[valuation.stage_probability]
PEA = 0.35
PFS = 0.50
FS = 0.60
permitted = 0.75
construction = 0.90

# Years from today to the construction start when the company hasn't guided one (a guided date in projects.csv
# `construction_start` always wins). Researched Nov 21, 2026; kept by the user Nov 22, 2026. The usual sequence is
# PEA to PFS 1-2 years, PFS to feasibility 1-2 years, feasibility to a construction decision (permits and
# financing) 1-3 years; S&P's long averages come from projects that stall, which the probability already covers.
[valuation.years_to_start]
PEA = 4
PFS = 3
FS = 2
permitted = 1
construction = 0

# Buy level and fair value by tier (Part 5): buy below buy x base-deck NPV (developers: base risk-adjusted NPV) and no
# higher than the pessimistic NPV (developers: only when the capex-overrun test passes); review above fair x base NPV.
# Starting values from the spec, decided with the user Nov 21, 2026 (royalty fair value 1.5x): Rule buys at large
# discounts to his own NPV (about 40% in a Dec 2025 example) and checks the downside first; he cites 15-20x cash flow
# for precious-metals royalties against 5-7x for base-metal producers (Kitco, Feb 2026); Sprott's typical P/NAV by
# stage (Aug 2022): PEA 0.2-0.5x, PFS/FS 0.5-0.7x, construction 0.5-0.8x, production 0.6-1.5x. None is a published
# Rule threshold, and none is fitted to data.
[valuation.buy]
producer = { buy = 0.6, fair = 1.0 }
royalty = { buy = 1.0, fair = 1.5 }
developer = { buy = 0.6, fair = 1.0 }

[portfolio_screen]
# `python -m minerval screen` (roadmap 5): proposes the Model portfolio's holdings and weights (A-F), review levels
# (S) and notes (U-V) from the framework's numbers. These are the rules, and public. Each bucket's total weight and
# number of names are private: private/screen.toml (see config/screen.example.toml). The output never goes into
# the repo, a log or the step summary: out/screen/ (local), the Sheet and, with --email, a private email.
# A name on the tab stays while it ranks within names + buffer, so the list doesn't churn on small rank changes once
# shares are bought. 0 while the portfolio is still being built (Nov 2026: nothing bought yet), so every name is
# picked on rank alone; raise it (2 was the spec's default) once the holdings are bought.
buffer = 0
tilt = 0.0                          # 0 = equal weights in a bucket; 0.5 = up to ±50% by score
bucket_order = ["Physical metal", "Royalty", "Gold producers", "Growth: expanding producers", "Copper producers",
                "Silver and polymetallic producers", "Growth: developers"]
speculation = ["Growth: expanding producers", "Growth: developers"]
physical_symbols = { PHYS = "PHYS", PSLV = "PSLV", COP = "COP-U.TO", "COP/U" = "COP-U.TO" }

# Which bucket a company falls in: by peer group (PNAV inputs AL) and main metal (largest revenue share in J:L for
# producers; the resource unit in AU for developers). `bucket` in pnav_companies.csv overrides it, with a reason.
[portfolio_screen.buckets]
"Royalty/streaming" = "Royalty"
"Developer" = "Growth: developers"
"Junior producer|gold" = "Growth: expanding producers"
"producer|gold" = "Gold producers"
"producer|copper" = "Copper producers"
"producer|silver" = "Silver and polymetallic producers"

# Markets. The user buys small amounts in an IRA at Fidelity, where (Brokerage Commission and Fee Schedule, file
# dated Sep 2026; check yearly): US-listed stocks and ADRs, including ADRs on OTC, $0 online; foreign ordinaries on
# OTC (symbols ending in F) $0 plus $50 if not DTC eligible; Dollarized International Trading rep-assisted only,
# $32.95, plus $50 for every country but Canada, plus ~1% FX; local-currency International Trading is closed to
# retirement accounts. So by default only companies with a US listing (exchange or ADR) or a Canadian listing are
# proposed (pnav_companies.csv us_listing / canada_listing). `screen --all-markets` adds the rest, marked.
[portfolio_screen.markets]
canada_rep_assisted = true          # keep Canadian names with no US OTC symbol recorded (rep-assisted, $32.95 a trade)
foreign_fee_note = "Foreign-only: about $50 a trade in an IRA"
canada_rep_note = "Canada, no US OTC symbol recorded: rep-assisted, $32.95 a trade"
# OTC ADRs (us_listing "OTC ADR: X") trade from none to millions of dollars a day. An ADR with no Canadian listing is
# proposed only if its median daily dollar volume over the last 3 months (days with no trade count as $0) reaches
# this floor; `screen` downloads it from Yahoo. Nov 2026: EVMNY $0.7M and ANGPY $1.4M a day pass; ANFTY $85k (11 of 40
# days without a trade), BVGLY (one trade in 3 months), KOZAY and HCHDY ($0) fail. Anywhere from $0.1M to $0.6M
# splits them the same way.
otc_adr_min_dollar_volume = 250000

# Hard filters: a company failing one isn't proposed (the report says which).
[portfolio_screen.filters]
financials_max_days = 275           # Holdings N within ~9 months: a company that stopped reporting is stale
price_max_days = 6                  # Holdings T: as the price report's "older than 6 days"
min_mcap_m = 300.0                  # producers and royalty companies, US$M: a liquidity floor
min_mcap_developer_m = 100.0
max_share_change_3y_pct = 30.0      # producers: more than 30% dilution in 3 years is a red flag
# Expanding producers fund construction and mergers with shares, so 30% would exclude most of them (Nov 2026: 5 of 8
# US/Canadian names); 100% still drops serial diluters.
max_share_change_3y_pct_by_bucket = { "Growth: expanding producers" = 100.0 }
# No filter on the jurisdiction add-on (removed Nov 2026, the user's call): a high-risk country shouldn't exclude a
# company whose financials are sound. The risk still counts through the discount rate in P/NAV and the score's
# `addon` and `addon_reliance` measures. Set max_addon_points (points) to bring a filter back.
max_peer_ev_ratio = 1.5             # developers: EV per weighted unit at most 1.5× the peer median (BW)
# Royalty companies: valued by the framework's own measures, not the peer norm (the Sheet's typical royalty multiple,
# 1.5× × 0.94 on Metal prices reference, sits below where the whole group has traded, so every royalty company reads
# 1.5-1.9× its norm in Nov 2026). Excluded when the framework band (PNAV inputs AS) is one of these, or the company
# is at or above the own-history "expensive" threshold (Signals royalty_own_pctile_median H, 75).
royalty_excluded_bands = ["Rich", "no independent NAV"]

# Score: rank percentiles within the bucket (1 = best), averaged with these weights. Equal by default; don't tune
# them to the backtest (most measures have no history, and one period's best fit is noise).
[portfolio_screen.score]
peer_norm = 1.0                     # valuation vs peer norm (lower)
pnav_low = 1.0                      # P/NAV at Low prices (lower)
breakeven_gap = 1.0                 # FCF breakeven ÷ today's metal price − 1 (lower)
net_cash_pct = 1.0                  # net cash, % of market value (higher)
share_change_3y = 1.0               # (lower)
addon = 1.0                         # jurisdiction add-on (lower)
addon_reliance = 1.0                # P/NAV with the add-on raised ÷ P/NAV today, PNAV inputs BX (lower)
pnav_after = 1.0                    # developers: P/NAV after a raise (lower; funded counts as best)
peer_ev_ratio = 1.0                 # developers: EV per weighted unit ÷ peer median (lower)
months_of_cash = 1.0                # developers (higher; cash-generating counts as best)
independent_pnav = 1.0              # royalty: independent P/NAV (lower)
own_pctile = 1.0                    # royalty: own-history percentile, P/NAV when recorded else P/OCF (lower)

# Review level S = review_multiple × peer norm (T flags K above S). A level typed by hand is kept.
[portfolio_screen.review]
review_multiple = 1.3
by_bucket = { "Growth: developers" = 1.5, "Royalty" = 2.0 }   # developers: study NPVs are rougher. Royalty: see
                                    # [portfolio_screen.filters] royalty_excluded_bands; their K runs 1.5-1.9 today

# Limits from the sizing research (warnings in the report, not hard stops; the user sets the sizes):
#   Rick Rule: royalties are the best business in mining (margins ~80% vs 15-20% for operators); "70% of resource
#   juniors are never cheap because they're worth nothing"; a junior sleeve of 5-10% of total assets, at most 12-15
#   names, 3-10% of the sleeve each (secondary summary). Doug Casey: ~10% in speculation for cautious investors.
#   Newsletter models: juniors 15-30% of a mining-stock portfolio; 20-40% streaming/royalty in a growth mix.
#   This tab is a mining sleeve next to bullion, so the 15-30%-of-mining-stocks range is the comparable one.
[portfolio_screen.limits]
max_name_weight = 0.06              # royalty and producers
max_name_weight_speculation = 0.03  # developers and expanding producers
max_speculation = 0.25              # developers + expanding producers, share of the whole portfolio
min_developers = 6                  # when the bucket holds any: fewer is a concentrated bet on juniors
max_developers = 15                 # Rule's cap
royalty_names = [2, 4]              # the universe is about six companies

[signal_backtest]
# `python -m minerval backtest-signals`: each signal at every month-end since first_month_end, against the tier
# outcome it is meant to predict over the next 3, 6 and 12 months. Reports only; never changes thresholds.
first_month_end = "2001-08-01"      # 12 months after COMEX gold and silver start on Yahoo (Aug 2000)
percentile_min_months = 60          # miners-against-metal percentiles count once the ETF has 5 years of history
aisc_margin_share = [0.45, 0.30]    # backtest only: (gold − AISC) ÷ gold at/above 45% "wide", at/below 30% "thin"

[signal_backtest.context_thresholds]   # context-only signals (no status on the Sheet): the rules still tested
real_yield_10y = [0.25, 0.10]       # [drop from 12-month high, % points; 3-month rise counted as "rising"]
usd_12m = [-0.03, 0.03]             # a 3% move in the dollar index over a year
two_year_minus_fed_funds = [-0.25, 0.25]   # a quarter point below fed funds: the market expects a cut

[signal_backtest.start]             # ignore a series before this date (first full month of trading)
GDX = "2006-06-01"
GDXJ = "2009-12-01"
SIL = "2010-05-01"
SILJ = "2012-03-01"
COPX = "2010-05-01"

# Threshold sweep: the lean-in status at each value of one threshold (g = Signals G, h = Signals H), other as set
[signal_backtest.sweep]
gold_silver_ratio = {threshold = "g", values = [70, 75, 80, 85, 90]}
real_yield_10y = {threshold = "g", values = [0.10, 0.25, 0.40, 0.60]}
two_year_3m_change = {threshold = "g", values = [-0.10, -0.25, -0.50, -0.75]}
two_year_minus_fed_funds = {threshold = "g", values = [-0.10, -0.25, -0.50, -0.75]}
usd_12m = {threshold = "g", values = [-0.01, -0.03, -0.05, -0.08]}
spy_drawdown = {threshold = "h", values = [-0.15, -0.20, -0.25, -0.30]}
gold_vs_diesel_12m = {threshold = "g", values = [0.0, 0.05, 0.10, 0.15, 0.20]}
gdx_gold_pctile10y = {threshold = "g", values = [10, 15, 20, 25, 30]}
sil_silver_pctile10y = {threshold = "g", values = [10, 15, 20, 25, 30]}
copx_copper_pctile10y = {threshold = "g", values = [10, 15, 20, 25, 30]}
aisc_margin_share = {threshold = "g", values = [0.35, 0.40, 0.45, 0.50, 0.55]}
breadth_sgdj = {threshold = "g", values = [0.5, 0.6, 0.7]}

[alerts]
# A signal's status change is alerted (a GitHub issue) once the new status has held this many recorded trading
# days in Signal history. Every change, confirmed or not, is still in out/signals/report.txt.
hold_days = 3

[report]
stale_days = 6          # flag prices older than this
big_move = 0.25         # flag moves larger than this over the last 5 trading days
share_change = 0.10     # flag share-count changes larger than this
