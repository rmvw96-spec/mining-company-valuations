# Yahoo quotes some prices in minor units. The Sheet's FX table uses upper-case codes, because
# XLOOKUP ignores case and "GBp" would otherwise match "GBP" (100x too large).
[yahoo.minor_units]
GBp = { code = "GBX", major = "GBP", per_major = 100 }
ZAc = { code = "ZAC", major = "ZAR", per_major = 100 }
