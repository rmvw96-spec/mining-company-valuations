# Settings for the Sprott miner ETF look-through valuations.
# Every command reads this file when it starts, so edits take effect on the next run.
# Personal settings (your Google Sheet ID, credentials path) go in private/local.toml instead.

[holdings]
file = "data/holdings.csv"          # one row per fund holding: fund, holding, ticker (Sprott's), weight_pct
as_of = "2026-11-13"                # date of the Sprott holdings snapshot
fund_order = ["SGDM", "SGDJ", "GBUG", "SLVR", "COPP", "COPJ"]
physical_trusts = ["PSLV", "COP/U"] # metal trusts: left out of company multiples
non_operating = ["INDA"]            # not a mining company (listed in COPP on Sprott's page)
stale_before = "2025-06-30"         # financials older than this are left out of fund multiples

[funds]
SGDM = { metal = "gold", focus = "Large gold miners" }
SGDJ = { metal = "gold", focus = "Junior gold miners" }
GBUG = { metal = "gold", focus = "Active gold & silver" }
SLVR = { metal = "silver", focus = "Silver miners + PSLV" }
COPP = { metal = "copper", focus = "Copper miners" }
COPJ = { metal = "copper", focus = "Junior copper miners" }

[price_model]
# A change in metal prices changes revenue by: revenue x sum(metal share x (price / average price - 1)).
ebitda_share = 0.95                 # share of that revenue change reaching EBITDA (royalties take ~5%)
cash_flow_share = 0.70              # share reaching operating and free cash flow (after ~30% tax)
average_window_days = 365           # window for the average price over a company's reported 12 months
# Producers' cost increase since their reported 12 months (0.10 = 10%). It lowers free cash flow by
# cash_flow_share x (revenue - FCF) x cost_increase. On the Sheet it is the Signals tab's producer_cost_increase input.
cost_increase = 0.0

# Revenue shares for companies not listed in config/metal_mix.csv, by their fund's metal.
[price_model.default_mix]
gold = { gold = 1.0 }
silver = { silver = 0.60, gold = 0.40 }
copper = { copper = 0.90 }

# Metal price scenarios ($/oz gold and silver, $/lb copper). "Today" is always the latest price.
# Keep these in step with 'Metal prices reference'!H15:K17 on the Sheet, which drives the Sheet's own formulas.
[scenarios]
Severe = { gold = 2200, silver = 25, copper = 3.0 }
Low = { gold = 3500, silver = 35, copper = 4.0 }
High = { gold = 4500, silver = 70, copper = 7.0 }
"All-time high" = { gold = 5586.2, silver = 121.3, copper = 6.83 }
# Valuation decks (roadmap 6, [valuation] decks): the user's, Nov 22, 2026, each the midpoint of the range they gave
# (gold $3,200-4,265 / $4,250-4,850 / $5,250-6,300 an oz; silver $35-50 / $63-66.75 / $80-100+; copper $4.55-5.65 /
# $5.90-7.08 / $7.70-9.50 a lb, i.e. $10,000-12,500 / $13,000-15,600 / $17,000-20,900 a tonne). Each metal is set on its
# own. The single reference values given beside them: gold ~$3,515, silver ~$41.56, copper ~$5.57 ($12,280/t).
Pessimistic = { gold = 3732.5, silver = 42.5, copper = 5.10 }
Base = { gold = 4550.0, silver = 64.875, copper = 6.49 }
Optimistic = { gold = 5775.0, silver = 90.0, copper = 8.60 }

[stress]
scenarios = ["Severe", "Low", "Today", "High"]   # columns of the stress test, in order
dilution_tolerance_days = { 1 = 100, 3 = 200 }    # how far a share count may sit from exactly 1 or 3 years back

[pnav]
# Discount rate = 10-year Treasury yield + risk premium + jurisdiction add-on (data/research/pnav_companies.csv).
ten_year_yield = 0.0512             # offline copy; the price updater refreshes the Sheet's own cell
risk_premium = 0.03
max_years = 25                      # reserve life used is capped at this
short_years = 10                    # the "10-year horizon" column
scenarios = ["Today", "Low", "High", "All-time high"]
no_metal_adjustment = ["VALT LN", "661 HK"]   # platinum producer and a smelter: cash flow is left as reported
sensitivity_points = 2              # the P/NAV sensitivity column: today's P/NAV with the add-on this many points higher

# Jurisdiction add-on from data/research/country_risk.csv (roadmap 4b; see minerval/jurisdiction.py).
[jurisdiction]
# Scored places: the average of the latest `years` Fraser Institute Policy Perception Index scores (0-100, best
# 100), mapped onto a straight line: 0 points at floor_score and above, top_addon at a score of 0, rounded to step.
# Rebuild after changing these: `jurisdiction --build private/<scores>.csv --source ... --as-of ...`.
years = 3
top_addon = 3.0                     # also the add-on of `top` rows (sanctions, or near the bottom of an earlier survey)
floor_score = 90.0                  # places scoring at least this get no add-on
step = 0.25
weight_tolerance = 0.02             # country_weights must sum to 1 within this (whole-percent shares round); they are rescaled to 1

[royalty_history]
# Royalty companies against their own history (roadmap 4c). P/OCF = month-end price of the US listing x shares
# outstanding / the latest annual operating cash flow filed with the SEC by then (data/research/royalty_ocf.csv,
# written by `royalty-ocf`). Today's value uses the same basis, so it compares like with like.
years = 5                           # the window today's P/OCF is ranked in (month-ends)
min_months = 36                     # fewer month-ends with positive cash flow than this: no percentile
pnav_min_days = 250                 # recorded independent P/NAV days (Company history) before that percentile shows
annual_forms = ["10-K", "40-F", "20-F", "10-K/A", "40-F/A", "20-F/A"]
edgar_url = "https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json"
edgar_user_agent = "minerval research admin@example.org"   # the SEC asks automated clients for a contact
# US listing -> SEC CIK. Sheet rows with another Yahoo symbol map to these in `sheet_symbols`.
companies = { WPM = 1323404, FNV = 1456346, RGLD = 85535, OR = 1627272, TFPM = 1829726, MTA = 1722606 }
sheet_symbols = { "WPM.TO" = "WPM", "FNV.TO" = "FNV", "OR.TO" = "OR", "TFPM.TO" = "TFPM" }

[yahoo]
user_agent = "Mozilla/5.0 (X11; Linux x86_64)"
workers = 6                         # parallel requests
history_start = "2020-01-01"        # first date of the fundamentals series fetched
metals = { gold = "GC=F", silver = "SI=F", copper = "HG=F" }   # COMEX front-month futures
ten_year_yield = "^TNX"             # quoted in percent (5.12 = 5.12%)

# Sprott exchange codes -> Yahoo suffixes, tried in order. Hong Kong (HK) codes are zero-padded to 4 digits.
[yahoo.suffixes]
AU = [".AX"]
LN = [".L"]
SJ = [".JO"]
TI = [".IS"]
PW = [".WA"]
IJ = [".JK"]
PM = [".PS"]
SS = [".ST"]
