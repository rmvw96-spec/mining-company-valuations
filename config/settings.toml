fcf_yield_SGDM = [0.08, 0.03]       # 8%+ is cheap for miners (12.5x FCF); under 3% (33x) is expensive
fcf_yield_SGDJ = [0.08, 0.03]
fcf_yield_COPP = [0.08, 0.03]
fcf_yield_SLVR = [0.08, 0.03]
