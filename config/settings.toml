# Settings for the Sprott miner ETF look-through valuations.
# Every command reads this file when it starts, so edits take effect on the next run.
# Personal settings (your Google Sheet ID, credentials path) go in private/local.toml instead.

[holdings]
file = "data/holdings.csv"          # one row per fund holding: fund, holding, ticker (Sprott's), weight_pct
as_of = "2026-11-13"                # date of the Sprott holdings snapshot
fund_order = ["SGDM", "SGDJ", "GBUG", "SLVR", "COPP", "COPJ"]
physical_trusts = ["PSLV", "COP/U"] # metal trusts: left out of company multiples
non_operating = ["INDA"]            # not a mining company (listed in COPP on Sprott's page)
stale_before = "2025-06-30"         # financials older than this are left out of fund multiples

[funds]
SGDM = { metal = "gold", focus = "Large gold miners" }
SGDJ = { metal = "gold", focus = "Junior gold miners" }
GBUG = { metal = "gold", focus = "Active gold & silver" }
SLVR = { metal = "silver", focus = "Silver miners + PSLV" }
COPP = { metal = "copper", focus = "Copper miners" }
COPJ = { metal = "copper", focus = "Junior copper miners" }

[price_model]
# A change in metal prices changes revenue by: revenue x sum(metal share x (price / average price - 1)).
ebitda_share = 0.95                 # share of that revenue change reaching EBITDA (royalties take ~5%)
cash_flow_share = 0.70              # share reaching operating and free cash flow (after ~30% tax)
average_window_days = 365           # window for the average price over a company's reported 12 months
# Producers' cost increase since their reported 12 months (0.10 = 10%). It lowers free cash flow by
# cash_flow_share x (revenue - FCF) x cost_increase. On the Sheet it is the Signals tab's producer_cost_increase input.
cost_increase = 0.0

# Revenue shares for companies not listed in config/metal_mix.csv, by their fund's metal.
[price_model.default_mix]
gold = { gold = 1.0 }
silver = { silver = 0.60, gold = 0.40 }
copper = { copper = 0.90 }

# Metal price scenarios ($/oz gold and silver, $/lb copper). "Today" is always the latest price.
# Keep these in step with 'Metal prices reference'!H15:K17 on the Sheet, which drives the Sheet's own formulas.
[scenarios]
Severe = { gold = 2200, silver = 25, copper = 3.0 }
Low = { gold = 3500, silver = 35, copper = 4.0 }
High = { gold = 4500, silver = 70, copper = 7.0 }
"All-time high" = { gold = 5586.2, silver = 121.3, copper = 6.83 }

[stress]
scenarios = ["Severe", "Low", "Today", "High"]   # columns of the stress test, in order
dilution_tolerance_days = { 1 = 100, 3 = 200 }    # how far a share count may sit from exactly 1 or 3 years back

[pnav]
# Discount rate = 10-year Treasury yield + risk premium + jurisdiction add-on (data/research/pnav_companies.csv).
ten_year_yield = 0.0512             # offline copy; the price updater refreshes the Sheet's own cell
risk_premium = 0.03
max_years = 25                      # reserve life used is capped at this
short_years = 10                    # the "10-year horizon" column
scenarios = ["Today", "Low", "High", "All-time high"]
no_metal_adjustment = ["VALT LN", "661 HK"]   # platinum producer and a smelter: cash flow is left as reported

[yahoo]
user_agent = "Mozilla/5.0 (X11; Linux x86_64)"
workers = 6                         # parallel requests
history_start = "2020-01-01"        # first date of the fundamentals series fetched
metals = { gold = "GC=F", silver = "SI=F", copper = "HG=F" }   # COMEX front-month futures
ten_year_yield = "^TNX"             # quoted in percent (5.12 = 5.12%)

# Sprott exchange codes -> Yahoo suffixes, tried in order. Hong Kong (HK) codes are zero-padded to 4 digits.
[yahoo.suffixes]
AU = [".AX"]
LN = [".L"]
SJ = [".JO"]
TI = [".IS"]
PW = [".WA"]
IJ = [".JK"]
PM = [".PS"]
SS = [".ST"]
FH = [".HE"]
MC = [".CS"]
CN = [".TO", ".V", ".CN", ".NE"]

# Yahoo quotes some prices in minor units. The Sheet's FX table uses upper-case codes, because
# XLOOKUP ignores case and "GBp" would otherwise match "GBP" (100x too large).
[yahoo.minor_units]
GBp = { code = "GBX", major = "GBP", per_major = 100 }
ZAc = { code = "ZAC", major = "ZAR", per_major = 100 }
ILA = { code = "ILA", major = "ILS", per_major = 100 }

[sheet]
# Which cells the commands read and write. Change these only if you move things on the Sheet.
holdings_tab = "Holdings"
last_row = 1000
price_headers = ["Share price (local currency)", "Price currency", "Price date",
                 "Shares outstanding (millions)", "US$ per unit of price currency"]   # Holdings!R1:V1
fx_headers = ["Currency", "US$ per unit", "Source", "Rate date"]                     # Holdings!Y1:AB1
# FX table order (Holdings!Y2:Y18). Only used for Claude Sheets payloads; with Google Sheets the table is read.
fx_rows = ["USD", "AUD", "CAD", "CLP", "CNY", "EUR", "GBP", "GBX", "HKD", "IDR", "MXN",
           "PHP", "PLN", "SEK", "TRY", "ZAR", "ZAC"]
fx_derived = { GBX = "GBP", ZAC = "ZAR" }     # rows that are formulas (=GBP rate / 100)

metals_tab = "Metal prices reference"
metal_cells = { gold = "C15", silver = "C16", copper = "C17" }
metal_labels = { gold = "Gold ($/oz)", silver = "Silver ($/oz)", copper = "Copper ($/lb)" }   # B15:B17
yield_cell = "C30"
yield_label = "10-year Treasury yield"                                                         # B30

downside_tab = "Holdings downside"
pnav_inputs_tab = "PNAV inputs"
pnav_first_row = 12
pnav_last_row = 154

# New layout added by `setup-sheet` (Signals tab, PNAV inputs AR:BE, P/NAV U:V, Holdings downside R, Model portfolio W:Y).
signals_tab = "Signals"
signals_first_row = 5               # first signal row (headers on row 4)
signals_last_row = 120              # how far down the code looks for keys in column A
pnav_tab = "P_NAV"                  # the P/NAV tab (row N there is PNAV inputs row N+10)
pnav_tab_first_row = 2
pnav_tab_last_row = 144
pnav_cost_label_cell = "G7"         # PNAV inputs: "Producer cost increase ..." label and its value
pnav_cost_cell = "H7"
pass_through_cell = "C32"           # Metal prices reference: share of a revenue change reaching cash flow
downside_first_row = 2
downside_last_row = 337
portfolio_tab = "Model portfolio"
portfolio_first_row = 6
portfolio_last_row = 31
signal_history_tab = "Signal history"     # one row per run date (history.py); the code manages these two tabs
company_history_tab = "Company history"   # long format: date, holding, Yahoo symbol, metric, value

# PNAV inputs columns: the existing ones the new formulas refer to, and the new ones (AR onwards).
[sheet.pnav_inputs]
holding = "B"
price = "C"
mcap = "D"
net_cash = "E"
revenue = "F"
fcf = "G"
ocf = "H"
basis = "I"
nav_per_share = "R"
independent_pnav = "AJ"
peer_group = "AL"
buy_below = "AR"
royalty_band = "AS"
resource_amount = "AT"
resource_unit = "AU"
resource_category = "AV"
resource_source = "AW"
cash = "AX"
fcf_12m = "AY"
ev = "AZ"
ev_per_unit = "BA"
ev_per_aueq_oz = "BB"
months_of_cash = "BC"
cash_share = "BD"
developer_check = "BE"
yahoo = "AP"                        # existing: the Yahoo symbol C and D look up

[sheet.pnav_tab_cols]
royalty_band = "U"
buy_below = "V"

[sheet.downside_cols]
low_fcf = "K"                       # the one ARRAYFORMULA on Holdings downside
ticker = "L"
cost_base = "R"                     # new helper: revenue - FCF, $M

[sheet.portfolio_cols]
bucket = "A"
holding = "B"
metal = "E"
timing = "W"
ev_per_aueq_oz = "X"
months_of_cash = "Y"

[signals]
# Market signals for the Signals tab (`python -m minerval signals`, also run at the end of `prices`).
daily = ["GC=F", "SI=F", "HG=F", "GDX", "GDXJ", "SIL", "SILJ", "COPX", "CL=F", "HO=F", "DX-Y.NYB", "SPY"]
monthly = ["GC=F", "SI=F", "HG=F", "GDX", "SIL", "COPX"]      # full monthly history, for percentiles
daily_range = "5y"                  # daily closes kept; 5 years lets `history --backfill` go back ~4 years
fred_series = "DFII10"              # 10-year TIPS real yield, %, daily; no API key
fred_url = "https://fred.stlouisfed.org/graph/fredgraph.csv?id={series}"
fred_api_url = "https://api.stlouisfed.org/fred/series/observations"   # used when FRED_API_KEY is set
ratio_history_start = "2000-08"     # gold/silver ratio percentile: month-ends from here (COMEX futures on Yahoo)
percentile_years = 10               # miners-against-metal percentiles: month-ends over this many years
uptrend_days = 200                  # trading days in the moving average
real_yield_change_days = 63         # ~3 months of trading days
tax_loss_window = ["11-01", "12-31"]   # month-day, inclusive: when juniors are sold for tax losses
fcf_yield_funds = ["SGDM", "SGDJ", "COPP", "SLVR"]

# Thresholds: [G, H] on the Signals tab. The Sheet's values win when the code runs against it; these are the
# record and the fallback. Each is chosen to match the framework's wording:
[signals.thresholds]
gold_silver_ratio = [80, 50]        # above 80 silver is historically cheap against gold; below 50 gold is
# real_yield_10y and usd_12m are context only since Nov 2026 (no edge in the backtest): their old thresholds
# are kept under [signal_backtest.context_thresholds].
spy_drawdown = [-0.10, -0.20]       # 10% off the high is a pullback, 20% a bear market ("panic")
royalty_pnav_median = [1.4, 2.2]    # framework: buy royalties at 1.1-1.4x NAV; 1.5-2.2x is their normal range
gold_vs_diesel_12m = [0.10, -0.10]  # a 10-point gap between the metal and diesel moves margins visibly
copper_vs_diesel_12m = [0.10, -0.10]
silver_vs_diesel_12m = [0.10, -0.10]
gdx_gold_pctile10y = [20, 80]       # bottom and top fifth of the last 10 years
sil_silver_pctile10y = [20, 80]
copx_copper_pctile10y = [20, 80]
fcf_yield_SGDM = [0.08, 0.03]       # 8%+ is cheap for miners (12.5x FCF); under 3% (33x) is expensive
fcf_yield_SGDJ = [0.08, 0.03]
fcf_yield_COPP = [0.08, 0.03]
fcf_yield_SLVR = [0.08, 0.03]

# Inputs block on the Signals tab (key = value). Blank ones are left for you to fill in on the Sheet.
[signals.inputs]
# industry_aisc (the Signals input row) comes from data/research/industry_aisc.csv: the latest quarter published
# by the run date. Python writes it to the Signals tab on every run; add new quarters to the CSV, not here.
producer_cost_increase = 0.0        # used by the P/NAV and Low-scenario cash flows (Part 3 of the spec)
near_cash_share = 0.5               # developer "trading near cash" when cash is at least this share of market value
runway_short_months = 12            # framework: hold at least 12 to 18 months of cash
runway_ok_months = 18

# Model portfolio column W: which signals each bucket shows (keys on the Signals tab, joined with " / ").
# "Bucket|Metal" entries win over "Bucket". "=text" shows the text itself; "@developer_check" is this row's
# PNAV inputs developer check. Any royalty/streaming company shows its royalty band instead.
[signals.timing]
"Physical metal|Gold" = ["=No timing signal (real yield and dollar are context only: see Signals)"]
"Physical metal|Silver" = ["gold_silver_ratio"]
"Physical metal|Copper" = ["=No framework signal for physical copper"]
"Gold producers" = ["gold_vs_diesel_12m", "gdx_gold_pctile10y"]
"Growth: expanding producers" = ["gold_vs_diesel_12m", "gdx_gold_pctile10y"]
"Copper producers" = ["copper_vs_diesel_12m", "copx_copper_pctile10y"]
"Silver and polymetallic producers" = ["silver_vs_diesel_12m", "sil_silver_pctile10y"]
"Growth: developers" = ["junior_timing", "@developer_check"]

[signal_backtest]
# `python -m minerval backtest-signals`: each signal at every month-end since first_month_end, against the tier
# outcome it is meant to predict over the next 3, 6 and 12 months. Reports only; never changes thresholds.
first_month_end = "2001-08-01"      # 12 months after COMEX gold and silver start on Yahoo (Aug 2000)
percentile_min_months = 60          # miners-against-metal percentiles count once the ETF has 5 years of history
aisc_margin_share = [0.45, 0.30]    # backtest only: (gold − AISC) ÷ gold at/above 45% "wide", at/below 30% "thin"

[signal_backtest.context_thresholds]   # context-only signals (no status on the Sheet): the rules still tested
real_yield_10y = [0.25, 0.10]       # [drop from 12-month high, % points; 3-month rise counted as "rising"]
usd_12m = [-0.03, 0.03]             # a 3% move in the dollar index over a year

[signal_backtest.start]             # ignore a series before this date (first full month of trading)
GDX = "2006-06-01"
GDXJ = "2009-12-01"
SIL = "2010-05-01"
SILJ = "2012-03-01"
COPX = "2010-05-01"

# Threshold sweep: the lean-in status at each value of one threshold (g = Signals G, h = Signals H), other as set
[signal_backtest.sweep]
gold_silver_ratio = {threshold = "g", values = [70, 75, 80, 85, 90]}
real_yield_10y = {threshold = "g", values = [0.10, 0.25, 0.40, 0.60]}
usd_12m = {threshold = "g", values = [-0.01, -0.03, -0.05, -0.08]}
spy_drawdown = {threshold = "h", values = [-0.15, -0.20, -0.25, -0.30]}
gold_vs_diesel_12m = {threshold = "g", values = [0.0, 0.05, 0.10, 0.15, 0.20]}
gdx_gold_pctile10y = {threshold = "g", values = [10, 15, 20, 25, 30]}
sil_silver_pctile10y = {threshold = "g", values = [10, 15, 20, 25, 30]}
copx_copper_pctile10y = {threshold = "g", values = [10, 15, 20, 25, 30]}
aisc_margin_share = {threshold = "g", values = [0.35, 0.40, 0.45, 0.50, 0.55]}

[report]
stale_days = 6          # flag prices older than this
big_move = 0.25         # flag moves larger than this over the last 5 trading days
share_change = 0.10     # flag share-count changes larger than this
